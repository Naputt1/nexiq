name: Version Packages

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build-native:
    if: "startsWith(github.event.head_commit.message, 'chore: version packages')"
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: pnpm --filter @nexiq/component-extension build:rs --target x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
            build: pnpm --filter @nexiq/component-extension build:rs --target aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: pnpm --filter @nexiq/component-extension build:rs --target x86_64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: pnpm --filter @nexiq/component-extension build:rs --target x86_64-pc-windows-msvc

    name: Build Native (${{ matrix.settings.target }})
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Build Native Binary
        run: ${{ matrix.settings.build }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: packages/component-extension/*.node
          if-no-files-found: error

  version:
    needs: build-native
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install

      - name: Download native artifacts
        if: needs.build-native.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: packages/component-extension/artifacts
          merge-multiple: true

      - name: Move artifacts to component-extension
        if: needs.build-native.result == 'success'
        run: |
          find packages/component-extension/artifacts -name "*.node" -exec mv {} packages/component-extension/ \;
          ls -l packages/component-extension/*.node

      - name: Build Packages
        run: |
          pnpm --filter @nexiq/shared build
          pnpm --filter @nexiq/extension-sdk build
          pnpm --filter @nexiq/analyser build
          pnpm --filter @nexiq/server build
          pnpm --filter @nexiq/component-extension build:ts
          pnpm --filter @nexiq/file-extension build
          pnpm --filter @nexiq/cli build
        env:
          MODE: production

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
